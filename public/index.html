</head><body><div id="app"></div><div id="toast" class="toast"></div>

<!-- Tyre route modules must load before the main router so their page functions exist when boot routing runs. -->
<script src="tyre-by-car-exact.js?v=15"></script>
<script src="tyre-by-size-exact.js?v=10"></script>
<script src="tyre-by-size-route-fix.js?v=9"></script>
<script src="app.js?v=143"></script>
<script>
(function(){
  function forceSizeRoute(){
    var p=location.hash.replace(/^#/,'').split('/');
    if(p[0]==='tyres'&&p[1]==='by-size'&&typeof window.tyresBySize==='function'){
      window.tyresBySize();
    }
  }
  window.addEventListener('hashchange',forceSizeRoute);
  window.addEventListener('load',function(){
    [0,100,300,700,1500,3000].forEach(function(ms){setTimeout(forceSizeRoute,ms)});
  });
  setTimeout(forceSizeRoute,0);
})();
</script>
